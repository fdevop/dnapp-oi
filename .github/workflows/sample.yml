# .github/workflows/sample.yml — in the PUBLIC recorder repo, not in DNApp.
#
# Every 15 minutes: one sample appended to data/<UTC date>.jsonl and pushed.
#
# The cadence is what it is because the reader tolerates a 45 min gap before it stops calling a
# value « measured » — and GitHub's scheduler is known to run late under load, sometimes by ten
# minutes or more. 15 min nominal keeps the late runs inside the tolerance. Minutes are free
# here: this repo is public.
name: sample

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:          # so a run can be forced without waiting for the schedule

# Two runs pushing to the same branch would race and one would be rejected. They queue instead,
# and a pending one is dropped rather than piling up: a missed sample is a gap, a wedged queue
# is an outage.
concurrency:
  group: sample
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sample:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: node sample.mjs

      - name: Commit the sample
        run: |
          git config user.name  "oi-recorder"
          git config user.email "oi-recorder@users.noreply.github.com"
          git add data
          git diff --staged --quiet && exit 0
          git commit -m "sample $(date -u +%FT%TZ)"
          # Rebase before pushing: a run that started earlier may have landed in between.
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push
